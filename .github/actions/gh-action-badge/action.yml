name: 'create badge'
description: 'Generate a custom SVG badge with fixed color and store it in your repository wiki'

branding:
  icon: 'award'
  color: 'blue'

inputs:
  badge-color:
    description: 'Color of the badge (hex format: #RRGGBB, e.g., #e32323)'
    required: true
    default: "#e32323"
  badge-label:
    description: 'Badge label (left side text)'
    required: true
    default: ""
  badge-filename:
    description: 'Badge filename (alphanumeric, dots, dashes, underscores only)'
    required: true
    default: ""
  badge-value:
    description: 'Badge value (right side text)'
    required: true

  image:
    description: 'Docker image to run (override only when testing this action)'
    required: false
    default: "ghcr.io/sgaunet/gh-action-badge:latest"

outputs:
  badge-url:
    description: "URL of the badge"
    value: ${{ steps.badge-url.outputs.badge-url }}

runs:
  using: "composite"
  steps:
    - name: Set GitHub Path
      run: echo "$GITHUB_ACTION_PATH" >> $GITHUB_PATH
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}

    - name: launch docker image
      run: docker run --rm 
        -e GITHUB_TOKEN=${{ github.token }} 
        -e GITHUB_ACTOR=${{ github.actor }} 
        -e GITHUB_ACTOR_ID=${{ github.actor_id }} 
        -e GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
        -e BADGE_COLOR=${{ inputs.badge-color }} 
        -e BADGE_LABEL=${{ inputs.badge-label }} 
        -e BADGE_FILENAME=${{ inputs.badge-filename }} 
        -e BADGE_VALUE=${{ inputs.badge-value }} 
        ${{ inputs.image }}
      shell: bash

    - name: url of the badge
      id: badge-url
      run: echo "badge-url=$(echo https://raw.githubusercontent.com/wiki/${GITHUB_REPOSITORY}/${{ inputs.badge-filename }})" >> $GITHUB_OUTPUT
      shell: bash
