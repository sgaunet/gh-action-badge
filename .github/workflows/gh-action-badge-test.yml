name: Generate simple badge
on:
  push:
    branches: [main]

# Group shared with the other badge-test workflow: both push to the same wiki
# repository, so they must never run concurrently. cancel-in-progress must stay
# false, otherwise each workflow would cancel its sibling.
concurrency:
  group: badge-tests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Test the image built from this commit rather than whatever :latest holds
      - name: Build image under test
        run: docker build . -t gh-action-badge:test

      - name: value-badge
        id: value-badge
        run: echo "BADGE_VALUE=80" >> $GITHUB_ENV

      - name: Generate badge
        id: badge-generation
        uses: ./.github/actions/gh-action-badge
        with:
          badge-color: "#e32323"
          badge-label: "label"
          badge-filename: "badge.svg"
          badge-value: "${{ env.BADGE_VALUE }}"
          image: "gh-action-badge:test"

      - name: Print url of badge
        run: |
          echo "Badge URL: ${{ steps.badge-generation.outputs.badge-url }}"
