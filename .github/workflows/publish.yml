name: publish docker image
on:
  # Only main and tags may write the shared :latest tag. Pull requests still build
  # the image so dependency bumps to the Dockerfile stay validated.
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags, required by git describe below
      -
        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (validation only, nothing published)
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build . --platform linux/amd64,linux/arm64

      # Default shell (bash -e -o pipefail) so a failed push fails the step
      - name: Build/Push image ghcr.io/sgaunet/gh-action-badge:latest
        if: github.event_name == 'push'
        run: |
          docker buildx build . --platform linux/amd64,linux/arm64 --push -t ghcr.io/sgaunet/gh-action-badge:latest

          # get tags of current commit
          tag=$(git describe --exact-match --tags "$(git log -n1 --pretty='%h')" 2>/dev/null || true)
          if [ -n "$tag" ]; then
            echo "docker buildx build . --platform linux/amd64,linux/arm64 --push -t ghcr.io/sgaunet/gh-action-badge:$tag"
            docker buildx build . --platform linux/amd64,linux/arm64 --push -t "ghcr.io/sgaunet/gh-action-badge:$tag"
          fi
