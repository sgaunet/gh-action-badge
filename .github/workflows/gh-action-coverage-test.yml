name: Generate coverage badges
on:
  push:
    branches: [main]

# Group shared with the other badge-test workflow: both push to the same wiki
# repository, so they must never run concurrently. cancel-in-progress must stay
# false, otherwise each workflow would cancel its sibling.
concurrency:
  group: badge-tests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Test the image built from this commit rather than whatever :latest holds
      - name: Build image under test
        run: docker build . -t gh-action-badge:test

      - name: coverage
        id: coverage
        run: echo "COVERAGE_VALUE=80" >> $GITHUB_ENV

      - name: Generate coverage badge
        id: coverage-badge
        uses: ./.github/actions/gh-action-coverage
        with:
          limit-coverage: "80"
          badge-label: "coverage"
          badge-filename: "coverage-badge.svg"
          badge-value: "${{ env.COVERAGE_VALUE }}"
          image: "gh-action-badge:test"

      - name: Generate coverage badge2
        id: coverage-badge2
        uses: ./.github/actions/gh-action-coverage
        with:
          limit-coverage: "90"
          badge-label: "coverage"
          badge-filename: "coverage-badge2.svg"
          badge-value: "${{ env.COVERAGE_VALUE }}"
          image: "gh-action-badge:test"

      - name: Print url of badge
        run: |
          echo "Badge URL: ${{ steps.coverage-badge.outputs.badge-url }}"

      - name: Print url of badge2
        run: |
          echo "Badge URL: ${{ steps.coverage-badge2.outputs.badge-url }}"
